<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <clipPath id="pc">
      <rect x="0" y="0" width="400" height="120" rx="60"/>
    </clipPath>
  </defs>

  <!-- Pill body -->
  <rect x="0" y="0" width="400" height="120" rx="60" fill="#023e58"/>

  <!-- Sky wash top-left -->
  <rect x="0" y="0" width="185" height="75" fill="#0077b6" clip-path="url(#pc)"/>

  <!-- Sun -->
  <circle cx="72" cy="48" r="20" fill="#ffd23f"/>
  <line x1="72" y1="20" x2="72" y2="13" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/>
  <line x1="93" y1="27" x2="98" y2="22" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/>
  <line x1="51" y1="27" x2="46" y2="22" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="48" x2="107" y2="48" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/>
  <line x1="44" y1="48" x2="37" y2="48" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/>

  <!-- Palm trunk left -->
  <rect x="17" y="62" width="5" height="52" rx="2" fill="#5a3210"/>
  <ellipse cx="8" cy="58" rx="16" ry="5" fill="#1a6e2e" transform="rotate(-30 8 58)"/>
  <ellipse cx="15" cy="53" rx="16" ry="5" fill="#228b36" transform="rotate(-5 15 53)"/>
  <ellipse cx="24" cy="55" rx="15" ry="5" fill="#1a6e2e" transform="rotate(25 24 55)"/>

  <!-- Palm trunk right -->
  <rect x="163" y="42" width="5" height="72" rx="2" fill="#5a3210"/>
  <ellipse cx="153" cy="38" rx="16" ry="5" fill="#1a6e2e" transform="rotate(-35 153 38)"/>
  <ellipse cx="162" cy="33" rx="16" ry="5" fill="#228b36" transform="rotate(-8 162 33)"/>
  <ellipse cx="172" cy="35" rx="15" ry="5" fill="#1a6e2e" transform="rotate(22 172 35)"/>

  <!-- Water slide tower -->
  <rect x="150" y="12" width="9" height="34" rx="1" fill="#8b5e2a"/>
  <rect x="146" y="10" width="17" height="7" rx="2" fill="#6b4518"/>
  <path d="M154 18 Q172 36 176 65" stroke="#00c2d6" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M154 18 Q172 36 176 65" stroke="#7eeaf5" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Wave layers -->
  <path d="M0 96 Q28 84 58 96 Q88 108 118 96 Q148 84 178 96 Q208 108 238 96 Q268 84 298 96 Q328 108 358 96 Q388 84 400 96 L400 120 L0 120 Z" fill="#0077b6" clip-path="url(#pc)"/>
  <path d="M0 108 Q32 96 64 108 Q96 120 128 108 Q160 96 192 108 Q224 120 256 108 Q288 96 320 108 Q352 120 384 108 Q396 104 400 108 L400 120 L0 120 Z" fill="#005f91" clip-path="url(#pc)"/>

  <!-- Outer rings -->
  <rect x="0" y="0" width="400" height="120" rx="60" fill="none" stroke="#00c2d6" stroke-width="3"/>
  <rect x="5" y="5" width="390" height="110" rx="56" fill="none" stroke="#ffd23f" stroke-width="1" opacity="0.4"/>

  <!-- Divider -->
  <line x1="192" y1="14" x2="192" y2="106" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>

  <!-- WONDERLAND -->
  <text x="300" y="64"
    text-anchor="middle"
    font-family="'Baloo 2', Georgia, serif"
    font-size="30" font-weight="900"
    fill="#ffd23f"
    stroke="#b8720a" stroke-width="1.5" paint-order="stroke"
    letter-spacing="0.5">Wonderland</text>

  <!-- Teal banner -->
  <rect x="210" y="72" width="182" height="24" rx="4" fill="#00c2d6"/>
  <polygon points="210,72 202,84 210,96" fill="#009aab"/>
  <polygon points="392,72 400,84 392,96" fill="#009aab"/>

  <!-- WATER PARK -->
  <text x="300" y="90"
    text-anchor="middle"
    font-family="'Nunito', Arial, sans-serif"
    font-size="13" font-weight="900"
    fill="#023e58"
    letter-spacing="3">WATER PARK</text>

  <!-- Coral dots -->
  <circle cx="213" cy="62" r="3" fill="#ff6b6b"/>
  <circle cx="387" cy="62" r="3" fill="#ff6b6b"/>

  <!-- Wave accent -->
  <path d="M206 54 Q212 48 218 54 Q224 60 230 54" stroke="#00c2d6" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
