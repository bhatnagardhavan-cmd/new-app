<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Wonderland Waterpark</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0077b6; overflow:hidden; }

  #splash {
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#0077b6 0%,#00c2d6 100%);
    color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    transition:opacity .4s ease;
  }
  #splash .droplet {
    width:90px; height:90px; background:#fff; border-radius:50% 50% 50% 0;
    transform:rotate(45deg); margin-bottom:28px; animation:bob 1.6s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{transform:rotate(45deg) translateY(0);} 50%{transform:rotate(45deg) translateY(-14px);} }
  #splash h1 { font-size:22px; font-weight:700; letter-spacing:.5px; margin:0 0 4px; }
  #splash p { font-size:13px; opacity:.85; margin:0; }
  #splash.hide { opacity:0; pointer-events:none; }

  #offline {
    position:fixed; inset:0; z-index:15; display:none;
    flex-direction:column; align-items:center; justify-content:center; text-align:center;
    background:#f8fdff; color:#023e58; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    padding:32px;
  }
  #offline.show { display:flex; }
  #offline .ico { font-size:52px; margin-bottom:16px; }
  #offline h2 { margin:0 0 8px; font-size:19px; }
  #offline p { margin:0 0 22px; font-size:14px; color:#5b7a89; max-width:280px; line-height:1.5; }
  #offline button {
    background:#0077b6; color:#fff; border:0; padding:12px 28px; border-radius:24px;
    font-size:15px; font-weight:600; cursor:pointer;
  }
  #offline button:active { background:#005f92; }
</style>
</head>
<body>

  <div id="offline">
    <div class="ico">🌊</div>
    <h2>Can't reach Wonderland right now</h2>
    <p>Check your internet connection and try again. If this keeps happening, please try later.</p>
    <button id="retryBtn">Retry</button>
  </div>

  <div id="splash">
    <div class="droplet"></div>
    <h1>WONDERLAND</h1>
    <p>Loading your splash-tastic adventure…</p>
  </div>

  <script>
    // ====== CONFIGURE YOUR LIVE SITE URL HERE ======
    var SITE_URL = "https://wonderlandwaterpark.in";
    // ================================================

    var splash = document.getElementById('splash');
    var offline = document.getElementById('offline');
    var retryBtn = document.getElementById('retryBtn');

    function showOffline() {
      splash.classList.add('hide');
      offline.classList.add('show');
    }

    function goToSite() {
      window.location.replace(SITE_URL);
    }

    function tryFetch(timeoutMs) {
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, timeoutMs);

      return fetch(SITE_URL, { mode: 'no-cors', cache: 'no-store', signal: controller.signal })
        .then(function () {
          clearTimeout(timer);
          return true;
        })
        .catch(function () {
          clearTimeout(timer);
          return false;
        });
    }

    function checkAndLoad() {
      offline.classList.remove('show');
      splash.classList.remove('hide');

      if (navigator.onLine === false) {
        showOffline();
        return;
      }

      // First attempt: 15s timeout (handles slow/cold-start servers)
      tryFetch(15000).then(function (ok) {
        if (ok) {
          goToSite();
          return;
        }
        // Second attempt: one retry after a short pause, 15s timeout
        setTimeout(function () {
          tryFetch(15000).then(function (ok2) {
            if (ok2) {
              goToSite();
            } else {
              showOffline();
            }
          });
        }, 1500);
      });
    }

    retryBtn.addEventListener('click', checkAndLoad);
    window.addEventListener('offline', showOffline);

    checkAndLoad();
  </script>
</body>
</html>
